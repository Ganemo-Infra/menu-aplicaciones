name: Validar y publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema==4.23.0
      - run: python validar.py
      - name: Preparar sitio (solo lo publico)
        run: |
          mkdir -p _sitio
          cp -r v1 referencia _sitio/
          cp index.html _sitio/
          # Ruta versionada estable: v1/menu.* se publica desde referencia/ (fuente unica, sin duplicados en git)
          cp referencia/menu.js referencia/menu.css _sitio/v1/
          touch _sitio/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _sitio

  publicar:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
